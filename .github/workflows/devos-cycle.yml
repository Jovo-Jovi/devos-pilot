# Dev OS automated cycle (OD-03). One run = one task attempt:
#   resolve task → Cursor builds on task/Tnn → surface guard → commit/push/PR → checks →
#   Claude reviews from the branch → surface guard → verdict.mjs decides → merge | human gate | retry | halt
# Start it from Actions → devos-cycle → Run workflow (inputs blank = next open task).
# OD-08: the fence chooses Grok effort/fast; Vercel preview per attempt (when DEVOS_VERCEL=true);
# screenshots for the reviewer's visual check; a usage-limit wait is resumed by the wait-and-resume
# job below (up to ~5.5 h) and otherwise by devos-resume.
name: devos-cycle
run-name: "devos ${{ inputs.task || 'next' }} · attempt ${{ inputs.attempt || '1' }}${{ inputs.review_only && ' · review only' || '' }}"

on:
  workflow_dispatch:
    inputs:
      task:
        description: "Task id, e.g. T03 (blank = next open task in docs/PHASES.md)"
        required: false
        default: ""
      attempt:
        description: "Attempt number (1 for a first run)"
        required: false
        default: "1"
      review_only:
        description: "Re-run only the reviewer on the existing task branch (after a reviewer/infra failure)"
        type: boolean
        required: false
        default: false
      effort:
        description: "Grok 4.7 effort (fence = use the reviewer's choice in the fence)"
        type: choice
        options: [fence, low, medium, high, xhigh]
        default: fence
      fast:
        description: "Cursor Fast mode (fence = use the reviewer's choice in the fence)"
        type: choice
        options: [fence, "no", "yes"]
        default: fence
      revision:
        description: "Set by /devos revise: a human revision may go past max_attempts"
        type: boolean
        required: false
        default: false
      reuse_review:
        description: "With review_only: keep the review file this attempt already wrote and only re-decide (PR-21)"
        type: boolean
        required: false
        default: false
      go:
        description: "Start now even if DEVOS_HEAVY=hold would hold this heavy task (PR-20)"
        type: boolean
        required: false
        default: false

concurrency:
  group: devos-cycle
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write
  statuses: write

jobs:
  resolve:
    if: vars.DEVOS_PAUSED != 'true'
    runs-on: ubuntu-latest
    outputs:
      done: ${{ steps.t.outputs.done }}
      task: ${{ steps.t.outputs.task }}
      name: ${{ steps.t.outputs.name }}
      risk: ${{ steps.t.outputs.risk }}
      attempt: ${{ steps.t.outputs.attempt }}
      branch: ${{ steps.t.outputs.branch }}
      builder_model: ${{ steps.t.outputs.builder_model }}
      reviewer_model: ${{ steps.t.outputs.reviewer_model }}
      reviewer_max_turns: ${{ steps.t.outputs.reviewer_max_turns }}
      reviewer_effort: ${{ steps.t.outputs.reviewer_effort }}
      reviewer_fallback: ${{ steps.t.outputs.reviewer_fallback }}
      held: ${{ steps.heavy.outputs.held }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: t
        run: node scripts/devos/next-task.mjs --task "${{ inputs.task }}" --attempt "${{ inputs.attempt }}" --revision "${{ inputs.revision }}"
      - if: steps.t.outputs.done == 'true'
        run: echo "::notice title=Dev OS::Every task in docs/PHASES.md is PASS. Nothing to run."
      - name: Heavy-run notice, or hold (PR-20)
        id: heavy
        if: steps.t.outputs.done == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          DEVOS_HEAVY: ${{ vars.DEVOS_HEAVY }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          node scripts/devos/heavy.mjs --task "${{ steps.t.outputs.task }}" --attempt "${{ steps.t.outputs.attempt }}" \
            --review-only "${{ inputs.review_only }}" --revision "${{ inputs.revision }}" --go "${{ inputs.go }}"
      - if: steps.heavy.outputs.held == 'true'
        run: |
          echo "::notice title=Dev OS::${{ steps.t.outputs.task }} is heavy and DEVOS_HEAVY=hold. Comment /devos go in the run notices issue to start it."

  cycle:
    needs: resolve
    if: needs.resolve.outputs.done == 'false' && needs.resolve.outputs.held != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    outputs:
      park_task: ${{ steps.park.outputs.task }}
      park_attempt: ${{ steps.park.outputs.attempt }}
      park_review_only: ${{ steps.park.outputs.review_only }}
      park_not_before: ${{ steps.park.outputs.not_before }}
      park_pr: ${{ steps.park.outputs.pr }}
      branch: ${{ needs.resolve.outputs.branch }}
    env:
      DEVOS_AUTOMATED: "1"
      NEXT_TELEMETRY_DISABLED: "1"
      TASK: ${{ needs.resolve.outputs.task }}
      NAME: ${{ needs.resolve.outputs.name }}
      RISK: ${{ needs.resolve.outputs.risk }}
      ATTEMPT: ${{ needs.resolve.outputs.attempt }}
      BR: ${{ needs.resolve.outputs.branch }}
      REPO: ${{ github.repository }}
      REVIEW_ONLY: ${{ inputs.review_only && 'true' || 'false' }}
    steps:
      # The agents never see a git credential: checkout keeps none, and only the push and gh
      # steps below receive a token (PR-04).
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm, Claude Code and the Cursor CLI
        run: |
          npm install -g pnpm@10 @anthropic-ai/claude-code
          curl https://cursor.com/install -fsS | bash
          echo "$HOME/.cursor/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Supabase CLI (backend module, PR-17)
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Check out the task branch (a reissue continues the same branch, PR-03)
        run: |
          git config user.name "devos-runner"
          git config user.email "devos-runner@users.noreply.github.com"
          if git rev-parse --verify --quiet "origin/$BR" >/dev/null; then
            git checkout -B "$BR" "origin/$BR"
            git merge-base --is-ancestor origin/main HEAD || git merge --no-edit origin/main
          elif [ "$REVIEW_ONLY" = "true" ]; then
            echo "::error::review_only needs an existing branch $BR"; exit 1
          else
            git checkout -b "$BR"
          fi
          test -f "docs/fences/$TASK.md" || { echo "::error::docs/fences/$TASK.md does not exist: the reviewer has not issued this fence"; exit 1; }
          mkdir -p .devos/logs
          cp devos/ci/mcp.ci.json .cursor/mcp.json
          if [ -f package.json ]; then
            # Visible progress and a hard limit, so a slow registry never looks like a frozen step.
            if ! timeout 600 pnpm install --frozen-lockfile --reporter=append-only 2>&1 | tee .devos/logs/install-before.log | grep -E "Progress|Done in|ERR" | tail -n 20; then
              echo "::warning::pnpm install (before build) failed or took over 10 minutes; the builder will see it"
            fi
          fi

      - name: Resolve the builder model (fence effort/fast, checked against `agent models`)
        id: bm
        env:
          CURSOR_KEY: ${{ secrets.CURSOR_API_KEY }}
        run: |
          if [ -n "$CURSOR_KEY" ]; then CURSOR_API_KEY="$CURSOR_KEY" agent models > .devos/models.txt 2>&1 || true; fi
          node scripts/devos/builder-model.mjs --task "$TASK" --effort "${{ inputs.effort || 'fence' }}" --fast "${{ inputs.fast || 'fence' }}"

      - name: Local Supabase for the builder (when the backend module is active)
        if: env.REVIEW_ONLY != 'true' && hashFiles('supabase/config.toml') != ''
        continue-on-error: true
        timeout-minutes: 15
        run: node scripts/devos/supabase.mjs start

      - name: Builder — Cursor CLI
        id: builder
        if: env.REVIEW_ONLY != 'true'
        timeout-minutes: 80
        env:
          CURSOR_KEY: ${{ secrets.CURSOR_API_KEY }}
          MODEL: ${{ steps.bm.outputs.model }}
          DEVOS_BUILDER_MODEL: ${{ steps.bm.outputs.model }}
          DEVOS_BUILDER_EFFORT: ${{ steps.bm.outputs.effort }}
          DEVOS_BUILDER_FAST: ${{ steps.bm.outputs.fast }}
        run: |
          test -n "$CURSOR_KEY" || { echo "::error::secret CURSOR_API_KEY is not set"; exit 1; }
          export CURSOR_API_KEY="$CURSOR_KEY"
          # The local database's names and throwaway keys, when the backend module is active (PR-17).
          if [ -f .devos/supabase.env ]; then set -a; . .devos/supabase.env; set +a; fi
          echo "builder: $MODEL (effort ${DEVOS_BUILDER_EFFORT}, fast ${DEVOS_BUILDER_FAST}, from ${{ steps.bm.outputs.source }}) ${{ steps.bm.outputs.note }}"
          node scripts/devos/render-prompt.mjs builder "$TASK" "$ATTEMPT" --out .devos/builder-prompt.md
          set +e
          # Heartbeat: Cursor's output goes to a file, so print progress every minute.
          ( t0=$(date +%s); while sleep 60; do
              echo "Cursor is working on $TASK: $(( ($(date +%s) - t0) / 60 )) min, $(git status --porcelain | wc -l) file(s) changed so far"
            done ) &
          hb=$!
          agent -p --force --trust --approve-mcps --model "$MODEL" --output-format json \
            "$(cat .devos/builder-prompt.md)" > .devos/builder.json 2> .devos/builder.err
          code=$?
          kill "$hb" 2>/dev/null
          echo "exit=$code" >> "$GITHUB_OUTPUT"
          echo "builder exit code: $code"
          tail -c 2000 .devos/builder.err || true

      - name: Guard — builder surface
        if: env.REVIEW_ONLY != 'true'
        run: node scripts/devos/guard-surfaces.mjs builder

      - name: Commit and push the builder's work, write runner evidence
        env:
          GH_TOKEN: ${{ secrets.DEVOS_PAT || github.token }}
        run: |
          rm -f .cursor/mcp.json
          REMOTE="https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"
          if [ "$REVIEW_ONLY" != "true" ]; then
            git add -A
            git commit --allow-empty -m "$TASK a$ATTEMPT: builder (${{ steps.bm.outputs.model }}, effort ${{ steps.bm.outputs.effort }}, fast ${{ steps.bm.outputs.fast }})"
            bash scripts/devos/sync-main.sh "$REMOTE"
            git push "$REMOTE" "HEAD:refs/heads/$BR"
          fi
          LOCAL=$(git rev-parse HEAD)
          REMOTE_SHA=$(git ls-remote "$REMOTE" "refs/heads/$BR" | cut -f1)
          {
            echo "# Runner evidence — $TASK attempt $ATTEMPT"
            echo
            echo "- Branch: \`$BR\`"
            echo "- HEAD: \`$LOCAL\`"
            echo "- Remote comparison: \`git ls-remote origin refs/heads/$BR\` = \`$REMOTE_SHA\` → $([ "$LOCAL" = "$REMOTE_SHA" ] && echo MATCH || echo MISMATCH)"
            echo "- Builder: \`${{ steps.bm.outputs.model }}\` (effort ${{ steps.bm.outputs.effort }}, fast ${{ steps.bm.outputs.fast }}, chosen by ${{ steps.bm.outputs.source }}) ${{ steps.bm.outputs.note }}"
            echo "- Builder exit code: ${{ steps.builder.outputs.exit || 'not run (review-only re-run)' }}"
            echo "- Grok ids offered by \`agent models\`: $( (grep -oE 'grok-[A-Za-z0-9.-]+' .devos/models.txt 2>/dev/null || true) | sort -u | tr '\n' ' ')"
            echo
            echo "## Changed files vs main"
            echo '```'
            git diff --stat origin/main...HEAD
            echo '```'
          } > .devos/runner-evidence.md
          cat .devos/runner-evidence.md

      - name: Open the pull request (or reuse it)
        env:
          GH_TOKEN: ${{ secrets.DEVOS_PAT || github.token }}
        run: |
          for l in "devos:0e8a16" "risk-1:c5def5" "risk-2:fbca04" "risk-3:d93f0b" "devos:human-gate:5319e7" "devos:halted:b60205" "devos:auto-merged:0e8a16" "devos:quota-wait:fbca04"; do
            gh label create "${l%:*}" --color "${l##*:}" --force --repo "$REPO" >/dev/null
          done
          # Use the OPEN PR for this branch only. A PR merged early by hand must not be reused (PR-13).
          PRN=$(gh pr list --repo "$REPO" --head "$BR" --state open --json number --jq '.[0].number // empty')
          if [ -z "$PRN" ]; then
            gh pr create --repo "$REPO" --base main --head "$BR" \
              --title "$TASK — $NAME" \
              --body "Dev OS task **$TASK** (risk $RISK). Fence: \`docs/fences/$TASK.md\`. Built by Cursor, reviewed by Claude; the verdict is posted below by the runner. Do not merge before the verdict: the \`devos/verdict\` status turns green on PASS." \
              --label devos --label "risk-$RISK" || echo "::notice::No PR yet (nothing differs from main); it is opened after the review commit."
            PRN=$(gh pr list --repo "$REPO" --head "$BR" --state open --json number --jq '.[0].number // empty')
          fi
          echo "PRN=$PRN" >> "$GITHUB_ENV"
          if [ -n "$PRN" ]; then
            gh pr edit "$PRN" --repo "$REPO" --remove-label "devos:halted" >/dev/null 2>&1 || true
            gh pr edit "$PRN" --repo "$REPO" --remove-label "devos:quota-wait" >/dev/null 2>&1 || true
          fi
          gh api "repos/$REPO/statuses/$(git rev-parse HEAD)" -f state=pending -f context=devos/verdict \
            -f description="Waiting for the Dev OS review of $TASK" >/dev/null || true

      - name: Builder outcome (PR-12)
        id: bs
        run: node scripts/devos/builder-status.mjs --task "$TASK" --attempt "$ATTEMPT" --exit "${{ steps.builder.outputs.exit }}" --review-only "$REVIEW_ONLY"

      - name: Park (usage limit) or halt (builder error) without spending a review
        if: steps.bs.outputs.state != 'ok'
        env:
          GH_TOKEN: ${{ secrets.DEVOS_PAT || github.token }}
          STATE: ${{ steps.bs.outputs.state }}
        run: |
          gh pr comment "$PRN" --repo "$REPO" --body-file .devos/builder-summary.md
          cat .devos/builder-summary.md >> "$GITHUB_STEP_SUMMARY"
          if [ "$STATE" = "quota" ]; then
            gh pr edit "$PRN" --repo "$REPO" --add-label "devos:quota-wait"
            echo "::warning title=Dev OS::$TASK parked: Cursor usage/rate limit. devos-resume retries hourly."
          else
            gh pr edit "$PRN" --repo "$REPO" --add-label "devos:halted"
            echo "::error title=Dev OS::$TASK halted: the builder failed (not a usage limit). See the PR comment."
          fi

      - name: Checks (evidence for the reviewer)
        if: steps.bs.outputs.state == 'ok'
        run: |
          if [ -f package.json ]; then
            timeout 600 pnpm install --frozen-lockfile --reporter=append-only > .devos/logs/install.log 2>&1 || echo "::warning::pnpm install --frozen-lockfile failed or took over 10 minutes"
            tail -n 3 .devos/logs/install.log
          fi
          node scripts/devos/run-checks.mjs

      - name: Vercel preview of this attempt (OD-08 §2)
        id: preview
        # With the backend module, previews need a preview database (vars.DEVOS_PREVIEW_DB); without one the
        # review uses the local build against the CI database instead (PR-18).
        if: steps.bs.outputs.state == 'ok' && vars.DEVOS_VERCEL == 'true' && (hashFiles('supabase/config.toml') == '' || vars.DEVOS_PREVIEW_DB == 'true')
        continue-on-error: true
        timeout-minutes: 12
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          GH_TOKEN: ${{ secrets.DEVOS_PAT || github.token }}
          CI: "1"
        run: |
          # Each Vercel command gets 5 minutes; a missing secret or an interactive prompt can no
          # longer hold the whole cycle. On failure the review simply runs without a preview.
          for v in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            [ -n "${!v}" ] || { echo "::warning title=Dev OS::secret $v is not set; skipping the preview"; exit 0; }
          done
          set -o pipefail
          vc() { timeout 300 npx --yes vercel@latest "$@" --token="$VERCEL_TOKEN" < /dev/null; }
          if ! { vc pull --yes --environment=preview && vc build; } > .devos/logs/vercel.log 2>&1; then
            echo "::warning title=Dev OS::Vercel pull/build failed or timed out; reviewing without a preview"
            tail -n 40 .devos/logs/vercel.log; rm -rf .vercel; exit 0
          fi
          # Uploads from this directory with .git moved aside (no commit author for Vercel to block)
          # and prints a URL only when Vercel returned one (PR-15, PR-16).
          url=$(DEVOS_VERCEL_LOG="$GITHUB_WORKSPACE/.devos/logs/vercel.log" bash scripts/devos/vercel-deploy.sh "$BR") || true
          rm -rf .vercel
          case "$url" in https://*) ;; *) echo "::warning title=Dev OS::Vercel deploy gave no URL"; tail -n 40 .devos/logs/vercel.log; exit 0 ;; esac
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "preview: $url"
          if [ -n "$PRN" ]; then gh pr comment "$PRN" --repo "$REPO" --body "Preview of $TASK attempt $ATTEMPT: $url"; fi

      - name: Screenshots for the reviewer's visual check (OD-08 §5)
        if: steps.bs.outputs.state == 'ok'
        continue-on-error: true
        env:
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          # screens.mjs falls back to the local build when the preview shows the Vercel login (PR-15).
          if [ -f package.json ] && grep -q '"@playwright/test"' package.json; then
            pnpm exec playwright install --with-deps chromium > .devos/logs/playwright-install.log 2>&1 || true
            if [ -n "${{ steps.preview.outputs.url }}" ]; then
              node scripts/devos/screens.mjs --base "${{ steps.preview.outputs.url }}"
            else
              node scripts/devos/screens.mjs
            fi
          else
            echo "No Playwright in the project; no screenshots."
          fi

      - name: Reviewer — Claude Code
        id: reviewer
        # reuse_review (PR-21): a complete review file from this attempt is kept; verdict.mjs reads it.
        if: steps.bs.outputs.state == 'ok' && !(inputs.reuse_review && hashFiles(format('docs/reviews/{0}-a{1}.md', env.TASK, env.ATTEMPT)) != '')
        timeout-minutes: 75
        env:
          OAUTH: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          APIKEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MODEL: ${{ needs.resolve.outputs.reviewer_model }}
          TURNS: ${{ needs.resolve.outputs.reviewer_max_turns }}
          EFFORT: ${{ needs.resolve.outputs.reviewer_effort }}
          FALLBACK: ${{ needs.resolve.outputs.reviewer_fallback }}
          DEVOS_PREVIEW_URL: ${{ steps.preview.outputs.url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          DEVOS_BUILDER_MODEL: ${{ steps.bm.outputs.model }}
          DEVOS_BUILDER_EFFORT: ${{ steps.bm.outputs.effort }}
          DEVOS_BUILDER_FAST: ${{ steps.bm.outputs.fast }}
        run: |
          [ -n "$OAUTH" ] && export CLAUDE_CODE_OAUTH_TOKEN="$OAUTH"
          [ -n "$APIKEY" ] && export ANTHROPIC_API_KEY="$APIKEY"
          [ -n "$OAUTH$APIKEY" ] || { echo "::error::set secret CLAUDE_CODE_OAUTH_TOKEN or ANTHROPIC_API_KEY"; exit 1; }
          if [ -f .devos/supabase.env ]; then set -a; . .devos/supabase.env; set +a; fi
          node scripts/devos/render-prompt.mjs reviewer "$TASK" "$ATTEMPT" --out .devos/reviewer-prompt.md
          set +e
          ( t0=$(date +%s); while sleep 60; do
              f="not yet"; [ -f "docs/reviews/$TASK-a$ATTEMPT.md" ] && f="written"
              echo "Claude is reviewing $TASK: $(( ($(date +%s) - t0) / 60 )) min, verdict file $f"
            done ) &
          hb=$!
          claude -p "$(cat .devos/reviewer-prompt.md)" \
            --model "$MODEL" \
            --effort "${EFFORT:-high}" \
            ${FALLBACK:+--fallback-model "$FALLBACK"} \
            --output-format json \
            --json-schema "$(cat devos/schemas/verdict.schema.json)" \
            --permission-mode dontAsk \
            --allowedTools "Read,Glob,Grep,Write,Edit,Bash" \
            --disallowedTools "Bash(git push *),Bash(git commit *),Bash(git checkout *),Bash(git reset *),Bash(gh *),Bash(curl *),Bash(wget *)" \
            --max-turns "$TURNS" > .devos/reviewer.json 2> .devos/reviewer.err
          rc=$?
          kill "$hb" 2>/dev/null
          echo "reviewer exit code: $rc"
          tail -c 2000 .devos/reviewer.err || true
          # Surface any tool calls the permission layer refused, so a denial is never silent.
          node -e 'try{const r=require("./.devos/reviewer.json");const d=r.permission_denials||[];console.log(`reviewer permission denials: ${d.length}`);for(const x of d.slice(0,20))console.log(" -",JSON.stringify(x).slice(0,300))}catch(e){console.log("reviewer.json unreadable:",e.message)}' 

      - name: Guard — reviewer surface
        if: steps.bs.outputs.state == 'ok'
        run: node scripts/devos/guard-surfaces.mjs reviewer

      - name: Verdict (PR-08 applied, recorded in docs/PHASES.md)
        id: v
        if: steps.bs.outputs.state == 'ok'
        run: node scripts/devos/verdict.mjs --task "$TASK" --attempt "$ATTEMPT"

      - name: Commit and push the review
        if: steps.bs.outputs.state == 'ok'
        env:
          GH_TOKEN: ${{ secrets.DEVOS_PAT || github.token }}
        run: |
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "$TASK a$ATTEMPT: review — ${{ steps.v.outputs.verdict }} (${{ steps.v.outputs.action }})"
            bash scripts/devos/sync-main.sh "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"
            git push "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" "HEAD:refs/heads/$BR"
          fi
          if [ -z "$PRN" ]; then
            gh pr create --repo "$REPO" --base main --head "$BR" --title "$TASK — $NAME (review record)" \
              --body "Dev OS: the review of $TASK, on a branch whose code is already on main." --label devos --label "risk-$RISK"
            PRN=$(gh pr list --repo "$REPO" --head "$BR" --state open --json number --jq '.[0].number // empty')
            echo "PRN=$PRN" >> "$GITHUB_ENV"
          fi
          case "${{ steps.v.outputs.verdict }}" in
            PASS) st=success; d="PASS: $TASK attempt $ATTEMPT" ;;
            WAIT) st=pending; d="Waiting for a usage limit to reset" ;;
            *)    st=failure; d="FAIL: $TASK attempt $ATTEMPT" ;;
          esac
          gh api "repos/$REPO/statuses/$(git rev-parse HEAD)" -f state="$st" -f context=devos/verdict -f description="$d" >/dev/null || true
          gh pr comment "$PRN" --repo "$REPO" --body-file .devos/verdict-summary.md
          cat .devos/verdict-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Act on the verdict
        if: steps.bs.outputs.state == 'ok'
        env:
          GH_TOKEN: ${{ secrets.DEVOS_PAT || github.token }}
          ACTION: ${{ steps.v.outputs.action }}
          NEXT_ATTEMPT: ${{ steps.v.outputs.next_attempt }}
        run: |
          case "$ACTION" in
            merge)
              gh pr edit "$PRN" --repo "$REPO" --add-label "devos:auto-merged"
              gh pr merge "$PRN" --repo "$REPO" --merge --delete-branch
              gh workflow run devos-cycle.yml --repo "$REPO" --ref main
              echo "::notice title=Dev OS::$TASK merged; next task dispatched." ;;
            human_gate)
              gh pr edit "$PRN" --repo "$REPO" --add-label "devos:human-gate"
              gh workflow run devos-doctor.yml --repo "$REPO" --ref main -f pr="$PRN" || true
              echo "::notice title=Dev OS::$TASK PASSED and waits at a human gate. Review and merge the PR to continue." ;;
            retry)
              gh workflow run devos-cycle.yml --repo "$REPO" --ref main -f task="$TASK" -f attempt="$NEXT_ATTEMPT"
              echo "::notice title=Dev OS::$TASK failed attempt $ATTEMPT; attempt $NEXT_ATTEMPT dispatched." ;;
            quota_wait)
              gh pr edit "$PRN" --repo "$REPO" --add-label "devos:quota-wait"
              echo "::warning title=Dev OS::$TASK parked: Claude usage/rate limit. devos-resume re-runs the review hourly." ;;
            halt)
              gh pr edit "$PRN" --repo "$REPO" --add-label "devos:halted"
              gh workflow run devos-doctor.yml --repo "$REPO" --ref main -f pr="$PRN" || true
              echo "::warning title=Dev OS::$TASK halted. A human decision is needed (see the PR comment)." ;;
            *) echo "::error::unknown action '$ACTION'"; exit 1 ;;
          esac

      - name: Parking info for the waiter (usage limits)
        id: park
        if: always()
        run: |
          echo "pr=$PRN" >> "$GITHUB_OUTPUT"
          if [ "${{ steps.bs.outputs.state }}" = "quota" ]; then
            { echo "task=$TASK"; echo "attempt=$ATTEMPT"; echo "review_only=false"; echo "not_before=${{ steps.bs.outputs.not_before }}"; } >> "$GITHUB_OUTPUT"
          elif [ "${{ steps.v.outputs.action }}" = "quota_wait" ]; then
            { echo "task=$TASK"; echo "attempt=$ATTEMPT"; echo "review_only=true"; echo "not_before=${{ steps.v.outputs.not_before }}"; } >> "$GITHUB_OUTPUT"
          fi

      - name: Keep the evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: devos-${{ needs.resolve.outputs.task }}-a${{ needs.resolve.outputs.attempt }}
          path: .devos/
          include-hidden-files: true
          if-no-files-found: ignore

      - name: Halt on a runner failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.DEVOS_PAT || github.token }}
        run: |
          echo "::error title=Dev OS::The cycle stopped on a runner failure (a guard, a missing secret or fence, or a push). Nothing was merged."
          gh pr edit "${PRN:-$BR}" --repo "$REPO" --add-label "devos:halted" 2>/dev/null || true
          gh pr comment "${PRN:-$BR}" --repo "$REPO" --body "Dev OS runner stopped on a failure in run ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}. Nothing was merged. Fix the cause, then re-run devos-cycle with task=$TASK attempt=$ATTEMPT." 2>/dev/null || true
          [ -n "$PRN" ] && gh workflow run devos-doctor.yml --repo "$REPO" --ref main -f pr="$PRN" 2>/dev/null || true

  # OD-08 §4: wait out a usage limit inside Actions instead of relying on GitHub's best-effort cron.
  # Claude's session limits reset within about five hours, so a wait up to resume.inline_wait_max_minutes
  # (330) is slept through here, then the task is re-dispatched. Longer waits (weekly limits) are
  # left to devos-resume. Remove the devos:quota-wait label, or cancel this run, to stop the wait.
  wait-and-resume:
    needs: cycle
    if: needs.cycle.outputs.park_task != ''
    runs-on: ubuntu-latest
    timeout-minutes: 345
    permissions:
      actions: write
      pull-requests: write
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          sparse-checkout: devos.config.json
      - name: Sleep until the limit resets, then resume
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TASK: ${{ needs.cycle.outputs.park_task }}
          ATTEMPT: ${{ needs.cycle.outputs.park_attempt }}
          REVIEW_ONLY: ${{ needs.cycle.outputs.park_review_only }}
          NOT_BEFORE: ${{ needs.cycle.outputs.park_not_before }}
          PR: ${{ needs.cycle.outputs.park_pr || needs.cycle.outputs.branch }}
        run: |
          max_min=$(node -e 'console.log(require("./devos.config.json").resume?.inline_wait_max_minutes ?? 330)')
          now=$(date -u +%s)
          target=$(date -u -d "$NOT_BEFORE" +%s 2>/dev/null || echo $((now + 3600)))
          wait=$(( target - now ))
          if [ "$wait" -gt $(( max_min * 60 )) ]; then
            echo "::notice title=Dev OS::$TASK resets at $NOT_BEFORE, beyond the ${max_min}-minute inline wait; devos-resume will pick it up."
            exit 0
          fi
          if [ "$wait" -gt 0 ]; then
            echo "Waiting $(( wait / 60 )) minutes, until $NOT_BEFORE (UTC), to resume $TASK attempt $ATTEMPT."
            sleep "$wait"
          fi
          labels=$(gh pr view "$PR" --repo "$REPO" --json labels --jq '[.labels[].name] | join(",")' 2>/dev/null || echo "")
          case ",$labels," in
            *",devos:quota-wait,"*) ;;
            *) echo "The devos:quota-wait label was removed; not resuming."; exit 0 ;;
          esac
          gh pr edit "$PR" --repo "$REPO" --remove-label "devos:quota-wait"
          gh workflow run devos-cycle.yml --repo "$REPO" --ref main \
            -f task="$TASK" -f attempt="$ATTEMPT" -f review_only="$REVIEW_ONLY" -f go=true
          echo "::notice title=Dev OS::Resumed $TASK attempt $ATTEMPT (review_only=$REVIEW_ONLY)."
