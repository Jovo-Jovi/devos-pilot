# Vercel production deploys (OD-08 §2). Previews are made per task attempt inside devos-cycle.
# Production deploys run:
#   - on a push to main that a person makes (your gate merges, your own pushes). The runner's own
#     auto-merges use the default GITHUB_TOKEN, which GitHub does not let trigger workflows, so
#     production moves at the gates you sign rather than after every task;
#   - or by hand: Actions → devos-deploy → Run workflow.
# Git deploys are off in vercel.json so Vercel never deploys behind the method's back.
# Needs: repository variable DEVOS_VERCEL=true and secrets VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID.
# Backend module (PR-18): with supabase/ in the tree and DEVOS_SUPABASE=true, a production deploy first
# takes an encrypted backup and applies the migrations (secrets SUPABASE_ACCESS_TOKEN, SUPABASE_DB_PASSWORD,
# SUPABASE_PROJECT_REF, DEVOS_BACKUP_PASSPHRASE). The app's own Supabase variables live in Vercel.
name: devos-deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: "Where to deploy main"
        type: choice
        options: [production, preview]
        default: production

concurrency:
  group: devos-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: vars.DEVOS_VERCEL == 'true' && vars.DEVOS_PAUSED != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g pnpm@10
      - name: Gate check — the guards must pass on what ships
        run: |
          pnpm install --frozen-lockfile
          node scripts/guards/run-all.mjs
      # Backend module (PR-18): the database moves before the app, and only after an encrypted backup.
      # A failure here stops the job: the old app keeps running against the old schema.
      - name: Supabase CLI
        if: hashFiles('supabase/config.toml') != '' && vars.DEVOS_SUPABASE == 'true' && (inputs.target || 'production') == 'production'
        uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Database — encrypted backup, then migrations
        if: hashFiles('supabase/config.toml') != '' && vars.DEVOS_SUPABASE == 'true' && (inputs.target || 'production') == 'production'
        timeout-minutes: 15
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          DEVOS_BACKUP_PASSPHRASE: ${{ secrets.DEVOS_BACKUP_PASSPHRASE }}
        run: |
          for v in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD SUPABASE_PROJECT_REF DEVOS_BACKUP_PASSPHRASE; do
            [ -n "${!v}" ] || { echo "::error title=Dev OS::secret $v is not set; the database was not touched and nothing was deployed"; exit 1; }
          done
          hint="If the project is paused (free plan, a week without activity), restore it in the Supabase dashboard and re-run this workflow."
          supabase link --project-ref "$SUPABASE_PROJECT_REF" -p "$SUPABASE_DB_PASSWORD" || { echo "::error title=Dev OS::supabase link failed. $hint"; exit 1; }
          mkdir -p "$RUNNER_TEMP/backup"
          supabase db dump --linked -p "$SUPABASE_DB_PASSWORD" -f "$RUNNER_TEMP/backup/schema.sql"
          supabase db dump --linked -p "$SUPABASE_DB_PASSWORD" --data-only -f "$RUNNER_TEMP/backup/data.sql"
          # Data leaves the runner only encrypted (handbook §10.3: backups are encrypted).
          gpg --batch --yes --pinentry-mode loopback --passphrase "$DEVOS_BACKUP_PASSPHRASE" \
            --symmetric --cipher-algo AES256 -o "$RUNNER_TEMP/backup/data.sql.gpg" "$RUNNER_TEMP/backup/data.sql"
          shred -u "$RUNNER_TEMP/backup/data.sql"
          echo "Pending migrations:"
          supabase db push --linked -p "$SUPABASE_DB_PASSWORD" --dry-run
          supabase db push --linked -p "$SUPABASE_DB_PASSWORD" --yes
          echo "::notice title=Dev OS::Backup taken and migrations applied to $SUPABASE_PROJECT_REF before the app deploy."
      - name: Keep the backup (encrypted data, plain schema; 30 days)
        if: hashFiles('supabase/config.toml') != '' && vars.DEVOS_SUPABASE == 'true' && (inputs.target || 'production') == 'production'
        uses: actions/upload-artifact@v4
        with:
          name: db-backup-${{ github.sha }}
          path: |
            ${{ runner.temp }}/backup/schema.sql
            ${{ runner.temp }}/backup/data.sql.gpg
          retention-days: 30
          if-no-files-found: error
      - name: Deploy
        id: d
        env:
          TARGET: ${{ inputs.target || 'production' }}
        run: |
          if [ "$TARGET" = "production" ]; then ENV=production; FLAG=--prod; else ENV=preview; FLAG=; fi
          npx --yes vercel@latest pull --yes --environment="$ENV" --token="$VERCEL_TOKEN"
          npx --yes vercel@latest build $FLAG --token="$VERCEL_TOKEN"
          # Uploads from this directory with .git moved aside, and fails unless Vercel returns a URL (PR-16).
          url=$(bash scripts/devos/vercel-deploy.sh main $FLAG)
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "::notice title=Dev OS::Deployed $(git rev-parse --short HEAD) to $TARGET: $url"
      - name: Smoke test the deployment
        env:
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          URL: ${{ steps.d.outputs.url }}
        run: |
          # Probe the deployment itself, never a local server: an empty URL is a failure (PR-16).
          case "$URL" in https://*) ;; *) echo "::error title=Dev OS::No deployment URL to smoke test"; exit 1 ;; esac
          node scripts/devos/probe.mjs --base "$URL" --strict / /ar /en /fr
